<body>

<header class="nav">

      <span>ASCYST</span>
    </a>
    <nav id="menu" class="links" aria-label="Main">
      <a href="#businesses">Businesses</a>
      <a href="#brands">Brands</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="tools">
      <button id="open" class="tb" type="button" aria-label="Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>/</kbd></button>

    <input id="q" type="text" placeholder="Search businesses, brands and contact" autocomplete="off" spellcheck="false" aria-controls="res"><kbd>esc</kbd></div>
